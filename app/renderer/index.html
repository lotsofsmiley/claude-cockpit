<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>claudpit</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    :root { --bg:#0b0d10; --rail:#0e1116; --line:#1c2230; --tab:#141a24; --txt:#cdd6e4;
      --accent:#1f6feb; --muted:#5c6675; }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a3340; border-radius: 6px; border: 2px solid #0b0d10; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4452; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
      font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }

    #app { display: flex; height: 100vh; }
    #app.layout-left { flex-direction: row; }
    #app.layout-top  { flex-direction: column; }

    #rail { background: var(--rail); display: flex; gap: 8px; }
    .layout-left #rail { width: 212px; flex-direction: column; padding: 8px;
      border-right: 1px solid var(--line); }
    .layout-top #rail { width: 100%; flex-direction: row; align-items: center;
      padding: 6px 8px; border-bottom: 1px solid var(--line); overflow-x: auto; }

    #railhead { display: flex; align-items: center; gap: 6px; }
    .layout-left #railhead { justify-content: space-between; }
    #brand { font-size: 12px; letter-spacing: .6px; color: #7aa2f7; display: flex; align-items: center; gap: 6px; }
    #brand .logo { width: 18px; height: 18px; flex: 0 0 auto; }
    #railhead .btns { display: flex; gap: 4px; }
    #railhead button { background: var(--tab); color: #aeb6c2; border: 1px solid #232b3a;
      border-radius: 6px; width: 28px; height: 24px; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; padding: 0; }
    #railhead button:hover { background: #1b2230; color: #fff; }
    #railhead button svg { width: 15px; height: 15px; }

    #media { padding: 8px; background: #0e1116; }
    .layout-left #media { border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
    .layout-top #media { border-left: 1px solid var(--line); display: flex; flex-direction: row; align-items: center; gap: 10px; }
    #searchBtn { display: flex; align-items: center; gap: 8px; background: #141a24; border: 1px solid #232b3a; color: var(--muted); border-radius: 6px; padding: 7px 9px; cursor: pointer; font: inherit; font-size: 13px; }
    #searchBtn:hover { background: #1b2230; color: var(--txt); }
    #searchBtn .s-ico svg { width: 14px; height: 14px; display: block; }
    #searchBtn .s-label { flex: 1; text-align: left; }
    #searchBtn kbd { font-size: 10px; color: var(--muted); border: 1px solid #2a3340; border-radius: 4px; padding: 1px 5px; }
    .layout-left #searchBtn { margin-top: auto; width: 100%; box-sizing: border-box; }
    .layout-top #searchBtn { margin-left: auto; }
    .layout-top #searchBtn .s-label, .layout-top #searchBtn kbd { display: none; }

    #palette { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 120; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
    .pal-box { width: 460px; max-width: 92vw; background: #11151c; border: 1px solid #2a3340; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.6); overflow: hidden; }
    #palInput { width: 100%; box-sizing: border-box; background: transparent; border: none; border-bottom: 1px solid #232b3a; color: #cdd6e4; font: inherit; font-size: 15px; padding: 13px 15px; outline: none; }
    #palList { max-height: 52vh; overflow-y: auto; padding: 6px; }
    .pal-group { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #5c6675; padding: 9px 8px 4px; }
    .pal-item { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--txt); }
    .pal-item.sel { background: rgba(31,111,235,.22); }
    .pal-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .pal-item .pal-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pal-item .pal-badge { color: #e3b341; font-weight: 700; }
    .pal-empty { color: #5c6675; padding: 14px; font-size: 13px; }
    .m-now { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .m-art { width: 36px; height: 36px; border-radius: 5px; overflow: hidden; background: #141a24; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; color: #5c6675; }
    .m-art img { width: 100%; height: 100%; object-fit: cover; }
    .m-art svg { width: 18px; height: 18px; }
    .m-info { min-width: 0; }
    .m-title { font-size: 12.5px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 132px; }
    .m-artist { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 132px; }
    .m-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .m-controls { display: flex; align-items: center; gap: 9px; }
    .m-btn { cursor: pointer; color: #aeb6c2; display: inline-flex; }
    .m-btn svg { width: 16px; height: 16px; }
    .m-btn:hover { color: #fff; }
    #mPlay svg { width: 19px; height: 19px; }
    .m-remain { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .m-bar { height: 3px; background: #1c2230; border-radius: 2px; overflow: hidden; }
    #mFill { height: 100%; width: 0; background: #7aa2f7; transition: width .3s linear; }
    .layout-top .m-bar { width: 80px; }
    .layout-top .m-info .m-artist { display: none; }

    #tabs { display: flex; gap: 6px; min-width: 0; }
    .layout-left #tabs { flex-direction: column; }
    .layout-top  #tabs { flex-direction: row; align-items: center; }
    .layout-top .tab, .layout-top .island-group { flex: 0 0 auto; }

    .tab { padding: 6px 8px; border-radius: 6px; background: var(--tab); font-size: 13px;
      cursor: pointer; display: flex; align-items: center; gap: 7px; max-width: 200px; }
    .tab.active { background: rgba(31,111,235,.20); outline: 1px solid rgba(31,111,235,.4); }
    .tab.attention { background: rgba(227,179,65,.14); outline: 1px solid rgba(227,179,65,.55); }
    .tab .badge { color: #e3b341; font-weight: 700; font-size: 13px; flex: 0 0 auto; }
    .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; flex: 0 0 auto; }
    @keyframes cocPulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .tab .dot.pulse { animation: cocPulse 1.1s ease-in-out infinite; }
    .island-hdr { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 11px;
      letter-spacing: .4px; text-transform: uppercase; color: #8b95a7; cursor: pointer; user-select: none; border-radius: 5px; }
    .island-hdr:hover { background: #141a24; }
    .island-hdr .caret { width: 10px; font-size: 10px; color: #5c6675; flex: 0 0 auto; }
    .island-hdr .idot { width: 8px; height: 8px; border-radius: 50%; background: #5c6675; flex: 0 0 auto; }
    .island-hdr .iname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .island-hdr .icount { margin-left: auto; color: #5c6675; font-size: 10px; }
    .island-hdr input.rename { background: var(--bg); border: 1px solid var(--accent); color: #fff;
      font: inherit; border-radius: 4px; padding: 1px 4px; width: 110px; text-transform: none; }
    .island-group { display: flex; gap: 6px; border: 1px solid #20283a; border-radius: 8px; padding: 6px; }
    .layout-left .island-group { flex-direction: column; }
    .layout-top .island-group { flex-direction: row; align-items: center; }
    .layout-top .island-hdr .icount { margin-left: 4px; }
    .tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .x { margin-left: auto; opacity: 0; width: 16px; height: 16px; line-height: 14px;
      text-align: center; border-radius: 4px; font-size: 13px; color: var(--muted); flex: 0 0 auto; }
    .tab:hover .x { opacity: .7; }
    .tab .x:hover { opacity: 1; background: rgba(248,81,73,.25); color: #fff; }
    .tab input.rename { background: var(--bg); border: 1px solid var(--accent); color: #fff;
      font: inherit; border-radius: 4px; padding: 1px 4px; width: 120px; }

    #main { flex: 1; position: relative; min-height: 0; min-width: 0; }
    #term { position: absolute; inset: 0; padding: 6px; }
    #status { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--muted);
      pointer-events: none; }

    .menu { position: absolute; z-index: 50; background: #11151c; border: 1px solid #232b3a;
      border-radius: 8px; padding: 4px; min-width: 168px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .menu .item { padding: 7px 10px; border-radius: 5px; font-size: 13px; cursor: pointer; }
    .menu .item:hover { background: #1b2230; }
    .menu .item.danger { color: #f85149; }
    .menu .sep { height: 1px; background: #232b3a; margin: 4px 2px; }
    .menu .label { padding: 4px 10px 2px; font-size: 11px; color: var(--muted); }
    .swatches { display: flex; gap: 6px; padding: 6px 10px; flex-wrap: wrap; }
    .swatch { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 1px solid #0006; }
    .swatch.none { background: repeating-linear-gradient(45deg,#222,#222 3px,#444 3px,#444 6px); }
    .hidden { display: none !important; }

    #dash { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: #0e1116;
      border-left: 1px solid #1c2230; z-index: 40; overflow-y: auto; padding: 10px; }
    #dash .dash-head { display: flex; justify-content: space-between; align-items: center;
      color: #7aa2f7; font-size: 13px; margin-bottom: 12px; }
    #dash #dashClose { cursor: pointer; color: #5c6675; }
    #dash #dashClose:hover { color: #fff; }
    #dash .dash-sec { margin-bottom: 16px; }
    #dash .dash-sec h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
      color: #5c6675; margin: 0 0 7px; }
    #dash .dash-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px;
      background: #141a24; border-radius: 6px; margin-bottom: 5px; font-size: 13px; }
    #dash .dash-msg { flex: 1; overflow-wrap: anywhere; }
    #dash .dash-meta { color: #5c6675; font-size: 11px; margin-top: 3px; }
    #dash .dash-empty { color: #5c6675; font-size: 12px; font-style: italic; }
    #dash .pri { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; background: #5c6675; }
    #dash .pri-high { background: #f85149; }
    #dash .pri-medium { background: #e3b341; }
    #dash .pri-low { background: #3fb950; }
    #dash .dash-cta { font-size: 12.5px; color: #8b95a7; line-height: 1.5; background: #141a24; border: 1px dashed #2a3340; border-radius: 8px; padding: 10px; }
    #dash .dash-link { color: #7aa2f7; cursor: pointer; display: inline-block; margin-top: 6px; }
    #dash .dash-link:hover { text-decoration: underline; }
    #dash input { width: 100%; background: #0b0d10; border: 1px solid #232b3a; color: #cdd6e4; border-radius: 5px; padding: 6px 8px; font: inherit; }

    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #11151c; border: 1px solid #232b3a; border-radius: 10px; width: 620px; max-width: 92vw; max-height: 86vh; overflow-y: auto; padding: 16px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; color: #7aa2f7; font-size: 14px; margin-bottom: 14px; }
    .modal-head #modalClose { cursor: pointer; color: #5c6675; }
    .modal-head #modalClose:hover { color: #fff; }
    .tmpl-row { display: flex; align-items: center; gap: 6px; padding: 6px; background: #141a24; border-radius: 6px; margin-bottom: 6px; }
    .tmpl-row input[type=text] { background: #0b0d10; border: 1px solid #232b3a; color: #cdd6e4; border-radius: 5px; padding: 5px 7px; font: inherit; }
    .tmpl-row .t-label { width: 140px; flex: 0 0 auto; }
    .tmpl-row .t-cwd { flex: 1; min-width: 60px; }
    .tmpl-row select { background: #0b0d10; border: 1px solid #232b3a; color: #cdd6e4; border-radius: 5px; padding: 5px; }
    .tmpl-row label.chk { font-size: 12px; color: #aeb6c2; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
    .tmpl-row .t-btn { cursor: pointer; color: #5c6675; padding: 3px 6px; border-radius: 4px; flex: 0 0 auto; }
    .tmpl-row .t-btn:hover { color: #fff; background: #1b2230; }
    .modal-hint { font-size: 12px; color: #5c6675; margin: 10px 2px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
    .modal-actions button { background: #141a24; color: #cdd6e4; border: 1px solid #232b3a; border-radius: 6px; padding: 7px 13px; cursor: pointer; font: inherit; }
    .modal-actions .primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .modal-actions button:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <div id="app" class="layout-left">
    <div id="rail">
      <div id="railhead">
        <span id="brand"><svg class="logo" viewBox="0 0 32 32" fill="none"><rect x="3" y="5" width="26" height="22" rx="5" fill="#0e1116" stroke="#1f6feb" stroke-width="2"/><path d="M9 13l4 3-4 3" stroke="#7aa2f7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="20" x2="23" y2="20" stroke="#7aa2f7" stroke-width="2.2" stroke-linecap="round"/></svg>claudpit</span>
        <div class="btns">
          <button id="btnDash" title="Dashboard"></button>
          <button id="btnNotify" title="Notifications"></button>
          <button id="btnLayout" title="Toggle layout (left / top)"></button>
          <button id="btnNew" title="New session (or right-click the rail)"></button>
        </div>
      </div>
      <div id="tabs"></div>
      <button id="searchBtn"><span class="s-ico"></span><span class="s-label">Search</span><kbd>Ctrl K</kbd></button>
      <div id="media" class="hidden">
        <div class="m-now">
          <span class="m-art"><img id="mediaArt" alt=""><span id="mArtFallback"></span></span>
          <div class="m-info"><div id="mTitle" class="m-title"></div><div id="mArtist" class="m-artist"></div></div>
        </div>
        <div class="m-row">
          <div class="m-controls"><span id="mPrev" class="m-btn"></span><span id="mPlay" class="m-btn"></span><span id="mNext" class="m-btn"></span></div>
          <span id="mVol" class="m-btn" title="Mute · scroll to change volume"></span>
        </div>
        <div class="m-bar"><div id="mFill"></div></div>
      </div>
    </div>
    <div id="main">
      <div id="term"></div>
      <div id="dash" class="hidden">
        <div class="dash-head"><span>Dashboard</span><span id="dashClose">✕</span></div>
        <div class="dash-sec"><h3>Claude → you</h3><div id="dashInbox"></div></div>
        <div class="dash-sec"><h3>Open handoffs</h3><div id="dashHandoffs"></div></div>
      </div>
      <div id="status">connecting…</div>
    </div>
  </div>

  <div id="newMenu" class="menu hidden"></div>
  <div id="tabMenu" class="menu hidden"></div>

  <div id="modal" class="hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modalTitle">Session types</span><span id="modalClose">✕</span></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="palette" class="hidden">
    <div class="pal-box">
      <input id="palInput" type="text" placeholder="Search sessions / islands…" autocomplete="off" spellcheck="false">
      <div id="palList"></div>
    </div>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
